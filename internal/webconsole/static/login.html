<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remnanode Console — вход</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">R</div>
    <p class="eyebrow">REMNANODE CONSOLE</p>
    <h1>Управление нодами</h1>
    <p class="muted">Войдите через Telegram. Доступ получат только операторы из списка <code>TELEGRAM_ALLOWED_USERS</code>.</p>
    <div class="telegram-login">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="{{.BotUsername}}"
        data-size="large"
        data-radius="10"
        data-userpic="false"
        data-auth-url="{{.AuthURL}}"></script>
    </div>
  </main>
</body>
</html>
