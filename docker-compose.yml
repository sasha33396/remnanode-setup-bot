services:
  deployer:
    build:
      context: .
    # File-backed Compose secrets retain root ownership. Run explicitly as
    # root so a normal root-owned 0600 deployment key works after clone.
    user: "0:0"
    restart: unless-stopped
    init: true
    # Makes token variables referenced by the panel configuration available to the
    # deployer without hard-coding panel-specific names in this file.
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?TELEGRAM_ALLOWED_USERS is required}
      PANELS_CONFIG_FILE: "${PANELS_CONFIG_FILE:-}"
      PANELS_JSON: "${PANELS_JSON:-}"
      REMNAWAVE_URL: ${REMNAWAVE_URL:-}
      REMNAWAVE_TOKEN: ${REMNAWAVE_TOKEN:-}
      DNS_BALANCER_URL: ${DNS_BALANCER_URL:-}
      DNS_BALANCER_TOKEN: ${DNS_BALANCER_TOKEN:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      CERTIFICATE_STORE_PATH: /var/lib/deployer/certificates
      REMNA_API_IP: ${REMNA_API_IP:-}
      METRICS_IP: ${METRICS_IP:?METRICS_IP is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEPLOY_SSH_PRIVATE_KEY: /run/secrets/deploy_ssh_private_key
      XRAY_SNI_REPO_URL: ${XRAY_SNI_REPO_URL:-https://github.com/sasha33396/sni-external.git}
      XRAY_SNI_REF: ${XRAY_SNI_REF:-v0.1.0-external}
      HEALTH_ADDR: :8080
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30s}
      SSH_CONNECT_TIMEOUT: ${SSH_CONNECT_TIMEOUT:-20s}
      SSH_COMMAND_TIMEOUT: ${SSH_COMMAND_TIMEOUT:-5m}
      NODE_CONNECT_TIMEOUT: ${NODE_CONNECT_TIMEOUT:-5m}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30s}
      TELEGRAM_SESSION_TTL: ${TELEGRAM_SESSION_TTL:-15m}
      NODE_MONITOR_INTERVAL: ${NODE_MONITOR_INTERVAL:-5m}
      NODE_CRITICAL_ALERT_INTERVAL: ${NODE_CRITICAL_ALERT_INTERVAL:-15m}
      NODE_MONITOR_CONFIRMATIONS: ${NODE_MONITOR_CONFIRMATIONS:-2}
      NODE_CRITICAL_ONLINE_FLOOR: ${NODE_CRITICAL_ONLINE_FLOOR:-80}
      NODE_CRITICAL_ONLINE_RATIO: ${NODE_CRITICAL_ONLINE_RATIO:-40}
      NODE_CRITICAL_ONLINE_CAP: ${NODE_CRITICAL_ONLINE_CAP:-200}
      CERTIFICATE_RENEW_BEFORE: ${CERTIFICATE_RENEW_BEFORE:-720h}
      CERTIFICATE_RENEW_INTERVAL: ${CERTIFICATE_RENEW_INTERVAL:-12h}
      CERTIFICATE_ISSUE_TIMEOUT: ${CERTIFICATE_ISSUE_TIMEOUT:-10m}
      DNS_PROPAGATION_TIMEOUT: ${DNS_PROPAGATION_TIMEOUT:-5m}
      DNS_PROPAGATION_INTERVAL: ${DNS_PROPAGATION_INTERVAL:-5s}
      MAX_CONCURRENT_DEPLOYMENTS: ${MAX_CONCURRENT_DEPLOYMENTS:-2}
      MAX_CERTIFICATE_DISTRIBUTIONS: ${MAX_CERTIFICATE_DISTRIBUTIONS:-4}
    secrets:
      - deploy_ssh_private_key
    volumes:
      - certificate_store:/var/lib/deployer/certificates
      - ./config:/etc/remnanode-setup-bot:ro
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      # Required for certificate volumes created by an older non-root image.
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  certificate_store:

secrets:
  deploy_ssh_private_key:
    file: ${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY is required}
